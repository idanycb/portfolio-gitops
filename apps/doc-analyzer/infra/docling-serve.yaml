apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling-serve
  namespace: doc-analyzer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: docling-serve
  template:
    metadata:
      labels:
        app: docling-serve
    spec:
      containers:
        - name: docling-serve
          image: quay.io/docling-project/docling-serve:v1.21.0
          env:
            - name: DOCLING_DEVICE
              value: cpu
            - name: DOCLING_SERVE_ENABLE_UI
              value: "false"
            - name: DOCLING_SERVE_MAX_SYNC_WAIT
              value: "300"
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 1200m
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: docling-serve
  namespace: doc-analyzer
spec:
  ports:
    - name: http
      port: 5001
      targetPort: http
  selector:
    app: docling-serve
